apiVersion: apps/v1
kind: Deployment
metadata:
  name: ventas
  namespace: tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ventas
  template:
    metadata:
      labels:
        app: ventas
    spec:
      containers:
        - name: ventas
          image: 630936672809.dkr.ecr.us-east-1.amazonaws.com/backend:ventas-v1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ventas-service
  namespace: tienda
spec:
  selector:
    app: ventas
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP