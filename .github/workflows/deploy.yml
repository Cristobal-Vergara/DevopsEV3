name: Deploy to Amazon EKS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      ####################################################
      # CHECKOUT
      ####################################################

      - name: Checkout repository
        uses: actions/checkout@v4

      ####################################################
      # AWS
      ####################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      ####################################################
      # LOGIN ECR
      ####################################################

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      ####################################################
      # FRONTEND
      ####################################################

      - name: Build Frontend
        working-directory: front_despacho
        run: |
          docker build -t frontend:latest .

      - name: Tag Frontend
        run: |
          docker tag frontend:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/frontend:latest

      - name: Push Frontend
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/frontend:latest

      ####################################################
      # BACKEND VENTAS
      ####################################################

      - name: Build Backend Ventas
        working-directory: Springboot-API-REST-VENTAS
        run: |
          docker build -t backend-ventas:latest .

      - name: Tag Backend Ventas
        run: |
          docker tag backend-ventas:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/backend:ventas-latest

      - name: Push Backend Ventas
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/backend:ventas-latest

      ####################################################
      # BACKEND DESPACHO
      ####################################################

      - name: Build Backend Despacho
        working-directory: Springboot-API-REST-DESPACHO
        run: |
          docker build -t backend-despacho:latest .

      - name: Tag Backend Despacho
        run: |
          docker tag backend-despacho:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/backend:despacho-latest

      - name: Push Backend Despacho
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/backend:despacho-latest

      ####################################################
      # KUBECTL
      ####################################################

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region ${{ secrets.AWS_REGION }} \
          --name ${{ secrets.EKS_CLUSTER_NAME }}

      ####################################################
      # APPLY MANIFESTS
      ####################################################

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      ####################################################
      # RESTART DEPLOYMENTS
      ####################################################

      - name: Restart Deployments
        run: |
          kubectl rollout restart deployment/frontend -n tienda
          kubectl rollout restart deployment/ventas -n tienda
          kubectl rollout restart deployment/despacho -n tienda

      ####################################################
      # WAIT
      ####################################################

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/frontend -n tienda
          kubectl rollout status deployment/ventas -n tienda
          kubectl rollout status deployment/despacho -n tienda

      ####################################################
      # VERIFY
      ####################################################

      - name: Verify
        run: |
          kubectl get pods -n tienda
          kubectl get svc -n tienda
